info:
  title: Some Server Doc
  description: Some server
  version: 1.0.0
openapi: 3.0.0
servers:
  - description: stable
    url: top_secret
paths:
  /handler:
    post:
      description: OperationRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationBody"
      parameters:
        - in: query
          name: op
          required: true
          schema:
            $ref: "#/components/schemas/Operation"
      responses:
        200:
          $ref: "#/components/responses/Response"
components:
  schemas:
    OperationBody:
      type: object
      properties:
        left:
          type: integer
          format: int64
        right:
          type: integer
          format: int64
      required:
        - left
        - right
    Operation:
      type: string
      enum:
        - sum
        - div
        - sub
        - prod
    ResponseBody:
      type: object
      properties:
        result:
          type: integer
          format: int64
      required:
        - result
  responses:
    Response:
      description: ""
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseBody"
